<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#d9c49e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<title>PickleBeasts — El mundo es tu pista</title>
<style>
:root{--tinta:#26332e;--lima:#c5f13a;--crema:#f6f0df;--coral:#f4775b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9c49e;color:var(--tinta);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none;touch-action:none}button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;z-index:3;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 15px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.brand{display:flex;align-items:center;gap:8px;font-weight:950;font-size:13px;letter-spacing:-.5px;text-shadow:0 1px 8px #fff8}.mark{width:31px;height:31px;border-radius:11px;background:var(--lima);display:grid;place-items:center;font-size:19px;box-shadow:0 3px 0 #26332e55}.hud-right{display:flex;gap:7px}.pill{background:#fff1d9e8;border:1px solid #fff9;border-radius:30px;padding:8px 11px;font-size:10px;font-weight:850;box-shadow:0 3px 12px #453b2818;backdrop-filter:blur(8px)}
.quest{position:fixed;z-index:3;top:calc(env(safe-area-inset-top) + 60px);left:15px;max-width:min(250px,67vw);padding:10px 13px;border-radius:14px;background:#fff3dfe8;box-shadow:0 5px 18px #4b3e2a20;pointer-events:none}.quest small{display:block;font-size:8px;letter-spacing:1.3px;font-weight:900;color:#a35d45}.quest strong{display:block;font-size:13px;margin-top:3px}.quest span{display:block;font-size:9px;color:#657064;margin-top:2px}
.controls{position:fixed;z-index:4;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 13px);height:135px;pointer-events:none}.joystick{position:absolute;left:18px;bottom:0;width:112px;height:112px;border-radius:50%;background:#fff5df55;border:2px solid #fff9;box-shadow:inset 0 0 0 1px #26332e12;pointer-events:auto;touch-action:none}.stick{position:absolute;width:43px;height:43px;left:33px;top:33px;border-radius:50%;background:#f8f0df;border:2px solid #fff;box-shadow:0 4px 10px #26332e44;pointer-events:none}.control-hint{position:absolute;left:18px;bottom:116px;font-size:8px;letter-spacing:1px;font-weight:900;color:#fff;text-shadow:0 1px 4px #26332e;pointer-events:none}.action{position:absolute;right:19px;bottom:8px;width:76px;height:76px;border-radius:50%;background:var(--lima);border:3px solid #fff;box-shadow:0 5px 0 #61752e,0 8px 20px #26332e33;font-size:10px;font-weight:950;pointer-events:auto;touch-action:manipulation}.action:active{transform:translateY(3px);box-shadow:0 2px 0 #61752e}.action b{display:block;font-size:23px;line-height:1.1}
.dock{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:5px;padding:6px;border-radius:20px;background:#26332ee8;box-shadow:0 6px 25px #1c2a2460;backdrop-filter:blur(12px)}.dock button{width:43px;height:43px;border-radius:14px;background:transparent;color:#f8f2e5;display:grid;place-items:center;font-size:19px}.dock button:active,.dock button.selected{background:var(--lima);color:var(--tinta)}.dock-label{position:fixed;z-index:5;bottom:calc(env(safe-area-inset-bottom) + 62px);left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:1px;font-weight:900;color:#fff;text-shadow:0 1px 5px #26332e;white-space:nowrap;pointer-events:none}
.toast{position:fixed;z-index:8;left:50%;top:43%;transform:translate(-50%,-50%);background:#26332ef2;color:#fff8e8;padding:13px 17px;border-radius:15px;font-size:12px;font-weight:750;box-shadow:0 8px 30px #26332e55;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;max-width:80vw}.toast.show{opacity:1}
.panel-back{position:fixed;z-index:9;inset:0;background:#1d292b66;display:none;align-items:flex-end;justify-content:center;padding:12px 12px calc(env(safe-area-inset-bottom) + 10px)}.panel-back.open{display:flex}.panel{width:min(100%,520px);background:var(--crema);border-radius:24px;padding:18px 18px 20px;box-shadow:0 15px 60px #101b1a55;animation:up .22s ease;max-height:72dvh;overflow:auto;touch-action:pan-y}.handle{width:38px;height:4px;border-radius:9px;background:#c9c0ad;margin:0 auto 15px}.panel-head{display:flex;justify-content:space-between;align-items:center}.panel-kicker{font-size:8px;letter-spacing:1.5px;font-weight:950;color:#8b7656}.panel h2{font-size:25px;letter-spacing:-1px;margin:5px 0 6px}.panel p{font-size:12px;line-height:1.55;color:#687269;margin:0}.close{width:32px;height:32px;border-radius:50%;background:#e7dfcf;font-size:19px}.panel-action{margin-top:16px;width:100%;border-radius:13px;background:var(--lima);padding:14px;font-size:12px;font-weight:950;box-shadow:0 3px 0 #758b38}.panel-action:active{transform:translateY(2px);box-shadow:0 1px 0 #758b38}.panel-stats{display:flex;gap:8px;margin-top:15px}.panel-stat{flex:1;background:#e9e2d2;border-radius:12px;padding:11px}.panel-stat b{display:block;font-size:18px}.panel-stat small{font-size:8px;color:#788078;font-weight:850}
@keyframes up{from{transform:translateY(25px);opacity:.5}to{transform:none;opacity:1}}
@media(min-width:700px){.controls{left:max(0px,calc((100vw - 520px)/2));right:max(0px,calc((100vw - 520px)/2))}.dock{bottom:20px}.dock-label{bottom:72px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Mundo de juego isométrico de PickleBeasts"></canvas>
<div class="hud"><div class="brand"><div class="mark">P</div><span>PICKLEBEASTS</span></div><div class="hud-right"><div class="pill">✦ <span id="xp">0</span> XP</div><div class="pill">NIV. 1</div></div></div>
<div class="quest"><small>PRIMERA MISIÓN</small><strong id="quest-title">Explora el club</strong><span id="quest-sub">Acércate a la pista y conoce tu nuevo hogar.</span></div>
<div class="control-hint">MOVER PERSONAJE</div>
<div class="controls"><div class="joystick" id="joystick"><div class="stick" id="stick"></div></div><button class="action" id="action"><b>↗</b>INTERACTUAR</button></div>
<div class="dock-label">EXPLORA TU MUNDO</div>
<nav class="dock" aria-label="Menú del juego"><button data-panel="carrera" aria-label="Carrera">⚑</button><button data-panel="club" aria-label="Club">⌂</button><button data-panel="coleccion" aria-label="Colección">◇</button><button data-panel="perfil" aria-label="Jugador">☺</button></nav>
<div class="toast" id="toast"></div>
<div class="panel-back" id="panel-back"><section class="panel" id="panel"><div class="handle"></div><div class="panel-head"><div class="panel-kicker" id="panel-kicker">TU AVENTURA</div><button class="close" id="close" aria-label="Cerrar">×</button></div><h2 id="panel-title">Tu carrera</h2><p id="panel-copy"></p><div class="panel-stats" id="panel-stats"></div><button class="panel-action" id="panel-action">Continuar</button></section></div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),joy=document.getElementById('joystick'),stick=document.getElementById('stick');
let W=0,H=0,dpr=1,px=0,py=0,moveX=0,moveY=0,joyId=null,near='',xp=0,toastTimer=0,worldTime=0;
const player={x:0,y:0,dir:0,walk:0};
const hotspots=[
 {id:'pista',x:.69,y:.49,label:'Pista principal'},
 {id:'club',x:.29,y:.43,label:'Casa club'},
 {id:'muelle',x:.86,y:.24,label:'Mirador'},
];
const panels={
 carrera:{k:'TU AVENTURA',t:'La carrera empieza aquí',p:'Tu primera misión es conocer la pista, aprender los golpes básicos y disputar tu primer partido. Cada desafío te abrirá nuevas zonas y rivales.',stats:[['01','CAPÍTULO'],['10','DESAFÍOS'],['0','VICTORIAS']],a:'Comenzar entrenamiento'},
 club:{k:'TU REFUGIO',t:'Club Solara',p:'Un pequeño club junto al mar que necesita recuperar su antiguo esplendor. Tu progreso en la pista permitirá devolverle la vida.',stats:[['01','PISTA'],['0','SOCIOS'],['1','NIVEL']],a:'Visitar la pista'},
 coleccion:{k:'TUS OBJETOS',t:'Una colección por descubrir',p:'Palas, ropa y recuerdos que conseguirás jugando. No hay atajos: cada objeto se gana en la pista.',stats:[['0','PALAS'],['0','EQUIPOS'],['0','RECUERDOS']],a:'Seguir explorando'},
 perfil:{k:'TU JUGADOR',t:'Un nuevo comienzo',p:'Tu personaje todavía está dando sus primeros pasos. A medida que juegues, definirás tu estilo, tus habilidades y tu reputación.',stats:[['1','NIVEL'],['0','PARTIDOS'],['0','TÍTULOS']],a:'Volver al mundo'}
};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);player.x=W*.48;player.y=H*.68}
addEventListener('resize',resize);resize();
function poly(points,fill,stroke=null,lw=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function ellipse(x,y,rx,ry,c){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}
function line(points,c,w=2){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.stroke()}
function tree(x,y,s=1){ellipse(x,y+10*s,19*s,6*s,'#5e7650');line([[x,y-5*s],[x,y+15*s]],'#8a6344',5*s);ellipse(x-8*s,y-11*s,14*s,16*s,'#64875a');ellipse(x+8*s,y-17*s,15*s,18*s,'#789866');ellipse(x,y-28*s,13*s,15*s,'#88a56d')}
function building(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
poly([[-75,0],[0,-38],[76,0],[0,39]],'#f4e5c9');poly([[-75,0],[-75,54],[0,96],[0,39]],'#c88769');poly([[0,39],[76,0],[76,54],[0,96]],'#b97860');
poly([[-85,-5],[0,-51],[87,-5],[0,43]],'#fff0d7');poly([[-85,-5],[0,-51],[87,-5],[0,7],[-85,7]],'#d4a17b');
poly([[-46,12],[-24,0],[-24,40],[-46,51]],'#6e9690');poly([[22,25],[48,11],[48,47],[22,61]],'#6e9690');line([[-46,12],[-24,0]],'#f7e8d1',3);line([[22,25],[48,11]],'#f7e8d1',3);
ctx.restore()}
function court(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
poly([[-126,0],[0,-63],[132,0],[0,66]],'#a98f6d');poly([[-116,-1],[0,-58],[121,0],[0,60]],'#7099c2');poly([[-98,0],[0,-48],[103,0],[0,50]],'#83acd0');
line([[-98,0],[0,50],[103,0]],'#fff6df',2);line([[0,-48],[0,50]],'#fff6df',2);line([[-51,-24],[51,25]],'#fff6df',2);line([[-5,-59],[-5,59]],'#26332e',3);line([[-5,-59],[-5,59]],'#fff',1);
poly([[-7,-59],[-3,-61],[7,-55],[3,-53]],'#26332e');ctx.restore()}
function person(x,y,scale=1,shirt='#f4775b',isPlayer=false){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ellipse(0,4,12,4,'#26332e30');line([[-5,-2],[-7,12]],'#26332e',4);line([[5,-2],[7,12]],'#26332e',4);poly([[-8,-18],[8,-18],[11,-2],[-10,-2]],shirt);ellipse(0,-25,7,8,'#bd8968');ellipse(-1,-31,8,5,'#5a4637');line([[8,-14],[16,-8]],'#bd8968',3);if(isPlayer){ctx.strokeStyle='#c5f13a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-10,19,0,Math.PI*2);ctx.stroke()}ctx.restore()}
function draw(){worldTime+=.016;ctx.clearRect(0,0,W,H);
const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#f3c89e');sky.addColorStop(.55,'#f1d6ad');sky.addColorStop(1,'#d8c39e');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
ellipse(W*.79,H*.17,28,28,'#fff0c9');poly([[0,H*.33],[W*.25,H*.26],[W*.48,H*.32],[W*.72,H*.25],[W,H*.32],[W,H*.52],[0,H*.52]],'#85b6b5');
for(let i=0;i<5;i++)line([[W*.08+i*W*.19,H*.39+i%2*7],[W*.27+i*W*.17,H*.39+i%2*7]],'#c4ddd0',1.5);
poly([[0,H*.46],[W*.3,H*.39],[W,H*.52],[W,H],[0,H]],'#d7c49e');
poly([[0,H*.7],[W*.4,H*.48],[W,H*.73],[W,H],[0,H]],'#c9b58e');
building(W*.24,H*.48,Math.min(1,W/430));court(W*.69,H*.55,Math.min(1,W/430));
tree(W*.08,H*.39,.95);tree(W*.43,H*.43,.75);tree(W*.91,H*.44,.9);tree(W*.53,H*.68,.65);
ellipse(W*.84,H*.25,23,5,'#7d9770');line([[W*.84,H*.25],[W*.84,H*.3]],'#896b4d',4);poly([[W*.78,H*.24],[W*.84,H*.18],[W*.9,H*.24],[W*.84,H*.3]],'#f5e6c7');
person(W*.34,H*.62,.92,'#7199c5');person(W*.74,H*.67,.86,'#e6b94f');
const dx=player.x,dy=player.y;
person(dx,dy,1,'#f4775b',true);
ctx.fillStyle='#fff';ctx.font='800 9px system-ui';ctx.textAlign='center';ctx.fillText('TÚ',dx,dy-43);
for(const h of hotspots){const hx=W*h.x,hy=H*h.y;const d=Math.hypot(player.x-hx,player.y-hy);if(d<Math.min(W,H)*.19){near=h.id;ellipse(hx,hy-38,13,13,'#c5f13a');ctx.fillStyle='#26332e';ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillText('+',hx,hy-33)}}
if(!hotspots.some(h=>Math.hypot(player.x-W*h.x,player.y-H*h.y)<Math.min(W,H)*.19))near='';
requestAnimationFrame(draw)}
requestAnimationFrame(draw);
function move(){const len=Math.hypot(moveX,moveY);if(len>.08){player.x+=moveX/Math.max(1,len)*2.2;player.y+=moveY/Math.max(1,len)*2.2;player.x=Math.max(22,Math.min(W-22,player.x));player.y=Math.max(H*.27,Math.min(H*.86,player.y))}}
setInterval(move,16);
function showToast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1900)}
function interact(){if(near==='pista'){openPanel('carrera')}else if(near==='club'){openPanel('club')}else if(near==='muelle'){showToast('Desde aquí descubrirás nuevos lugares de la costa.')}else{showToast('Acércate a la pista o a la casa club para interactuar.')}}
document.getElementById('action').addEventListener('click',interact);
function openPanel(id){const p=panels[id];if(!p)return;document.getElementById('panel-kicker').textContent=p.k;document.getElementById('panel-title').textContent=p.t;document.getElementById('panel-copy').textContent=p.p;document.getElementById('panel-action').textContent=p.a;document.getElementById('panel-stats').innerHTML=p.stats.map(s=>'<div class="panel-stat"><b>'+s[0]+'</b><small>'+s[1]+'</small></div>').join('');document.getElementById('panel-back').classList.add('open')}
function closePanel(){document.getElementById('panel-back').classList.remove('open')}
document.getElementById('close').addEventListener('click',closePanel);document.getElementById('panel-back').addEventListener('click',e=>{if(e.target.id==='panel-back')closePanel()});
document.getElementById('panel-action').addEventListener('click',()=>{closePanel();if(near==='pista'){xp+=10;document.getElementById('xp').textContent=xp;document.getElementById('quest-title').textContent='¡Primer entrenamiento!';document.getElementById('quest-sub').textContent='Has dado el primer paso. Sigue explorando.';showToast('+10 XP · Entrenamiento iniciado')}else showToast('¡Sigue explorando el club!')});
document.querySelectorAll('[data-panel]').forEach(b=>b.addEventListener('click',()=>openPanel(b.dataset.panel)));
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(joyId);updateJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)updateJoy(e)});function updateJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=e.clientX-cx,y=e.clientY-cy;const m=Math.hypot(x,y),max=34;if(m>max){x=x/m*max;y=y/m*max}moveX=x/max;moveY=y/max;stick.style.transform='translate('+x+'px,'+y+'px)'}function endJoy(e){if(e.pointerId!==joyId)return;joyId=null;moveX=moveY=0;stick.style.transform='translate(0,0)'}joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);
canvas.addEventListener('pointerdown',e=>{if(e.clientY<H*.76){const tx=e.clientX,ty=e.clientY;const vx=tx-player.x,vy=ty-player.y,len=Math.hypot(vx,vy);if(len>24){moveX=vx/len;moveY=vy/len;setTimeout(()=>{moveX=moveY=0},Math.min(900,len/2.2*16))}}});
addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w')moveY=-1;if(e.key==='ArrowDown'||e.key==='s')moveY=1;if(e.key==='ArrowLeft'||e.key==='a')moveX=-1;if(e.key==='ArrowRight'||e.key==='d')moveX=1;if(e.key===' '||e.key==='Enter')interact()});addEventListener('keyup',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)){moveX=moveY=0}});
})();
</script>
</body>
</html>
